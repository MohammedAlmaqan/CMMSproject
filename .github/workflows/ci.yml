name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmms?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-used-in-production
      NODE_ENV: test
      SEED_DEMO: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # npm 11 blocks dependency lifecycle scripts by default; foreground scripts keep Prisma generation available.
      - name: Install dependencies
        working-directory: backend
        run: npm ci --foreground-scripts
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Lint baseline
        working-directory: backend
        shell: bash
        run: |
          set +e
          npx eslint src tests --format json > /tmp/cmms-eslint.json
          set -e
          cat /tmp/cmms-eslint.json
          errors=$(node -e "const fs=require('fs');const report=JSON.parse(fs.readFileSync('/tmp/cmms-eslint.json','utf8'));process.stdout.write(String(report.reduce((sum,file)=>sum+file.errorCount,0)))")
          echo "ESLINT_ERRORS=$errors"
          if [ "$errors" -gt 50 ]; then
            exit 1
          fi
      - name: Apply migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Seed test data
        working-directory: backend
        run: npx tsx prisma/seed.ts
      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci --foreground-scripts
      - name: Typecheck
        working-directory: app
        run: npx tsc -b
      - name: Build
        working-directory: app
        run: npm run build
      - name: Test
        working-directory: app
        run: npm test
